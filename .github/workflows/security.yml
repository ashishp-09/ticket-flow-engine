name: Security & Vulnerability Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 4 * * 1'

jobs:
  security-audit:
    name: Dependency Audit & Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv and pip-audit
        run: |
          pip install pip-audit

      - name: Run pip-audit for backend dependencies
        run: |
          cd backend && pip-audit --desc on || true
